<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Produtos — DSW 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body>

<div id="toast" class="toast">
    <span class="dot"></span>
    <span id="toast-msg"></span>
</div>

<header>
    <div class="logo-mark">P</div>
    <h1>Gestão de Produtos</h1>
    <span>DSW 2026 / UNEMAT · localhost:3003</span>
</header>

<main>
    <p class="section-label">Adicionar produto</p>
    <div class="form-card">
        <div class="form-grid">
            <div class="form-group">
                <label for="inp-nome">Nome *</label>
                <input id="inp-nome" type="text" placeholder="Ex: Notebook Dell" />
            </div>
            <div class="form-group">
                <label for="inp-tipo">Tipo *</label>
                <input id="inp-tipo" type="text" placeholder="Ex: notebook" />
            </div>
            <div class="form-group">
                <label for="inp-status">Status</label>
                <select id="inp-status">
                    <option value="disponivel">Disponível</option>
                    <option value="emprestado">Emprestado</option>
                    <option value="manutencao">Manutenção</option>
                </select>
            </div>
            <div class="form-group full-width-mobile">
                <label for="inp-descricao">Descrição *</label>
                <input id="inp-descricao" type="text" placeholder="Ex: Intel i7, 16GB RAM" />
            </div>
            <button class="btn btn-primary" onclick="criarProduto()">+ Adicionar</button>
        </div>
    </div>

    <div class="stats" id="stats"></div>

    <p class="section-label">Produtos cadastrados</p>
    <div class="filters">
        <input id="f-nome" type="text" placeholder="Filtrar por nome ou descrição…" oninput="listarProdutos()" />
        <input id="f-tipo" type="text" placeholder="Filtrar por tipo…" oninput="listarProdutos()" />
        <select id="f-status" onchange="listarProdutos()">
            <option value="">Todos os status</option>
            <option value="disponivel">Disponível</option>
            <option value="emprestado">Emprestado</option>
            <option value="manutencao">Manutenção</option>
        </select>
        <button class="btn btn-secondary" onclick="limparFiltros()">Limpar</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-body"></tbody>
        </table>
    </div>
</main>

<div class="overlay" id="overlay" onclick="fecharModal(event)">
    <div class="modal">
        <h2>Editar Produto <span class="id-chip" id="modal-id-chip"></span></h2>
        <input type="hidden" id="edit-id" />
        <div class="form-group">
            <label>Nome *</label>
            <input id="edit-nome" type="text" />
        </div>
        <div class="form-group">
            <label>Tipo *</label>
            <input id="edit-tipo" type="text" />
        </div>
        <div class="form-group">
            <label>Descrição *</label>
            <input id="edit-descricao" type="text" />
        </div>
        <div class="form-group">
            <label>Status</label>
            <select id="edit-status">
                <option value="disponivel">Disponível</option>
                <option value="emprestado">Emprestado</option>
                <option value="manutencao">Manutenção</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="salvarEdicao()">Salvar</button>
        </div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
